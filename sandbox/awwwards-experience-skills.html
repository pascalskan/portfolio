<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Awwwards pass · Experience &amp; Skills</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--sans:'Bricolage Grotesque',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;--gut:clamp(16px,5vw,72px);--out:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box}html,body{margin:0}body{overflow-x:clip;background:#1636e8;color:#fff;font-family:var(--sans);-webkit-font-smoothing:antialiased}
#bar{position:fixed;z-index:100;top:0;left:0;right:0;display:flex;gap:12px;align-items:center;padding:10px 14px;background:rgba(10,11,13,.92);color:#fff;font:500 12px var(--mono)}
#bar select{font:inherit;background:#1b1d22;color:#fff;border:1px solid #3a3d45;border-radius:8px;padding:8px 10px;max-width:72vw}
h2,h3,p,ul{margin:0}ul{padding:0;list-style:none}
.page{padding:calc(48px + 64px) var(--gut) 120px;max-width:1500px;margin-inline:auto}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}
h2{font-weight:800;letter-spacing:-.06em;font-size:clamp(2.6rem,7vw,6rem);line-height:.9}
.head>span{font:500 .75rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#cdd6ff}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.14em;margin-bottom:-.14em}.w>span{display:inline-block}
.bento{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;margin-bottom:clamp(56px,8vw,110px)}
.tile{border-radius:22px;padding:clamp(20px,2.4vw,34px);min-height:210px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;position:relative;overflow:hidden;min-width:0;translate:0 0;transition:translate .25s var(--out)}
.tile h3{font-size:clamp(1.2rem,2vw,1.7rem);letter-spacing:-.03em;line-height:1.08}
.org{font:500 .72rem var(--mono);letter-spacing:.1em;text-transform:uppercase;opacity:.7;margin-top:8px}
.d{line-height:1.5;opacity:.9;margin-top:12px;font-size:.95rem}
.y{font-weight:800;font-size:clamp(2.6rem,6vw,5rem);line-height:.9;letter-spacing:-.06em}
.k{font:700 .75rem var(--mono);letter-spacing:.16em;text-transform:uppercase;opacity:.7}
.n{font-weight:800;font-size:clamp(2.4rem,5vw,4rem);line-height:.9;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.tile ul{display:flex;flex-wrap:wrap;gap:6px}.tile li{font-size:.85rem;padding:5px 11px;border-radius:99px;border:1px solid color-mix(in srgb,currentColor 32%,transparent)}
.gold{background:#ffe14d;color:#10131f}.ink{background:#0b0c10;color:#f3f1ea}.cream{background:#f3f1ea;color:#10131f}.orange{background:#ff7a45;color:#150a05}
.ink .n{color:#ffe14d}.sk .tile{justify-content:flex-start;min-height:260px}.sk .tile ul{margin-top:auto}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}
@media(max-width:860px){.bento>*{grid-column:span 6!important}.tile{min-height:0}}
/* V2 tilt + glare (fine pointer only) */
.tilt .tile{transform-style:preserve-3d;will-change:transform}
.tilt .tile::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.35),transparent 60%);mix-blend-mode:soft-light}
.tilt .tile:hover::after{opacity:1}
/* V3 marquee */
.mq{overflow:hidden;margin:0;padding:18px 0;border-block:2px solid #fff}
.mq .row{display:flex;gap:48px;width:max-content;font-weight:800;font-size:clamp(3rem,9vw,8rem);letter-spacing:-.06em;line-height:1;text-transform:uppercase;white-space:nowrap}
.mq .row span:nth-child(even){color:#ffe14d}
.mq+.mq{border-top:0}
/* V4 stack */
.stack{display:block}.stack .tile{position:sticky;top:calc(72px + var(--i)*18px);min-height:62vh;margin-bottom:18px;grid-column:auto}
.stack .tile .y{font-size:clamp(3.4rem,10vw,9rem)}
/* V5 spotlight */
.spot{position:relative}
.spot .tile{opacity:1}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
</head><body>
<div id="bar"><label for="sel">Awwwards pass</label><select id="sel">
<option value="1">1 · Centre-out reveal: tiles open from the middle with a mask wipe</option>
<option value="2">2 · Depth tilt: 3D pointer tilt + moving glare, springy return</option>
<option value="3">3 · Velocity marquee: skills as giant strips that react to scroll speed</option>
<option value="4">4 · Sticky stack: experience cards pile up as you scroll</option>
<option value="5">5 · Skill spotlight: count + weighted bars, hover isolates one skill area</option>
</select></div>
<div id="root"></div>
<script>
const E=s=>s.replace(/&/g,'&amp;'),li=a=>a.map(x=>`<li>${E(x)}</li>`).join('');
const SK=[['Languages',['Python','TypeScript / JavaScript','SQL','PHP','Java','HTML / CSS']],['Data & ML',['pandas, NumPy, SciPy','scikit-learn','Time-series forecasting','Walk-forward validation','Feature engineering','Statistical testing','D3']],['Engineering',['React, Vite, Tailwind','FastAPI, Express','PostgreSQL','Git, GitHub Actions','pytest, Playwright','Accessibility (axe, WCAG AA)']],['Product & systems',['Workflow design','Role-based access','Audit logging','Technical writing','Release and handover docs']]];
const words=t=>t.split(' ').map(w=>`<span class="w" aria-hidden="true"><span>${w}</span></span>`).join(' ');
const head=(a,b)=>`<div class="head"><h2 aria-label="${a}">${words(a)}</h2><span aria-hidden="true">${b}</span></div>`;
const T=(c,s,x,at='')=>`<article class="tile ${c} ${s}" ${at}>${x}</article>`;
const yr=(sr,v)=>`<p class="y"><span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">${sr}</span><span aria-hidden="true">${v}</span></p>`;
const role=(sr,v,h,o,d)=>`${yr(sr,v)}<div><h3>${h}</h3><p class="org">${o}</p><p class="d">${d}</p></div>`;
const EXP=()=>[
 T('gold','s4',role('2026 to present','2026 →','Freelance Web Developer','Travel Without Borders · M.G. Drive Pro','Front-end rebuild of a live production WordPress site as an upgrade-safe child theme, and a full-stack build for a local driving instructor, both with measurement, accessibility and documentation built in.')),
 T('ink','s2',role('Graduated 2026','BSc','BSc Computer Science, Newcastle University','Graduated 2026','Modules: Machine Learning, Data Science, Software Engineering, Database Systems, Algorithms & Data Structures, Software Architecture, Data Visualisation, AI Implementation.')),
 T('cream','s3',role('2021 to present','2021 →','Site Worker','Residential renovation · 2021 – 2025','Worked on the build as a regular site worker from 2021.')),
 T('orange','s3',role('2025 to present','2025 →','Site Supervisor','Residential renovation · since 2025','Given the supervisor role in 2025. Since then I have coordinated contractors, scheduling, procurement and on-site delivery across concurrent workstreams.'))].join('');
const SKT=()=>SK.map(([h,a],i)=>T(i==1?'cream':'ink','s3',`<h3 class="k">${E(h)}</h3><p class="n" data-n="${a.length}" aria-hidden="true">${String(a.length).padStart(2,'0')}</p><ul>${li(a)}</ul>`,`data-g="${i}"`)).join('');
const V={
1:()=>`<div class="page">${head('Experience','2021 → now')}<div class="bento" id="b1">${EXP()}</div>${head('Skills','4 areas')}<div class="bento sk" id="b2">${SKT()}</div></div>`,
2:()=>`<div class="page tilt">${head('Experience','2021 → now')}<div class="bento">${EXP()}</div>${head('Skills','4 areas')}<div class="bento sk">${SKT()}</div></div>`,
3:()=>`<div class="page">${head('Experience','2021 → now')}<div class="bento">${EXP()}</div>${head('Skills','4 areas')}</div>
  ${SK.map(([h,a],i)=>`<div class="mq" role="group" aria-label="${E(h)}: ${a.map(E).join(', ')}"><div class="row" aria-hidden="true">${[...a,...a,...a].map(x=>`<span>${E(x)}</span>`).join('')}</div></div>`).join('')}<div style="height:20vh"></div>`,
4:()=>`<div class="page">${head('Experience','2021 → now')}<div class="bento stack">${EXP().replace(/<article class="tile/g,(m,o)=>m)}</div>${head('Skills','4 areas')}<div class="bento sk">${SKT()}</div></div>`,
5:()=>`<div class="page">${head('Experience','2021 → now')}<div class="bento">${EXP()}</div>${head('Skills','hover a group')}<div class="bento sk spot">${SK.map(([h,a],i)=>T(i==1?'cream':'ink','s3',`<h3 class="k">${E(h)}</h3><p class="n" data-n="${a.length}" aria-hidden="true">${String(a.length).padStart(2,'0')}</p><div class="bars" aria-hidden="true" style="display:flex;gap:4px;align-items:flex-end;height:44px">${a.map((_,j)=>`<i style="flex:1;height:${40+((j*37)%60)}%;background:currentColor;opacity:.85;border-radius:3px;transform-origin:bottom"></i>`).join('')}</div><ul>${li(a)}</ul>`,`data-g="${i}" tabindex="0"`)).join('')}</div></div>`};
const root=document.getElementById('root'),sel=document.getElementById('sel');
const rm=matchMedia('(prefers-reduced-motion: reduce)');let ctx,cleanup=[];
function play(){
 ctx&&ctx.revert();cleanup.forEach(f=>f());cleanup=[];ScrollTrigger.getAll().forEach(s=>s.kill());
 if(rm.matches)return;
 const v=sel.value;
 ctx=gsap.context(()=>{
  root.querySelectorAll('h2').forEach(h=>gsap.from(h.querySelectorAll('.w>span'),{yPercent:115,duration:.9,ease:'expo.out',stagger:.07,scrollTrigger:{trigger:h,start:'top 90%',once:true}}));
  root.querySelectorAll('.n[data-n]').forEach(n=>{const o={v:0},N=+n.dataset.n;n.textContent='00';gsap.to(o,{v:N,duration:.9,ease:'power3.out',scrollTrigger:{trigger:n,start:'top 92%',once:true},onUpdate:()=>n.textContent=String(Math.round(o.v)).padStart(2,'0')})});
  if(v==='1'){root.querySelectorAll('.bento').forEach(b=>{const t=[...b.children];const mid=(t.length-1)/2;
    gsap.from(t,{clipPath:'inset(50% 50% 50% 50% round 22px)',opacity:0,scale:.96,duration:1,ease:'expo.out',stagger:{each:.09,from:'center'},scrollTrigger:{trigger:b,start:'top 85%',once:true}});
    t.forEach(c=>gsap.from(c.querySelectorAll('li,.d,.org'),{y:12,opacity:0,duration:.6,ease:'power3.out',stagger:.03,delay:.45,scrollTrigger:{trigger:c,start:'top 88%',once:true}}))})}
  else if(v==='2'){gsap.utils.toArray('.tile',root).forEach(t=>gsap.from(t,{y:28,opacity:0,scale:.97,duration:.85,ease:'expo.out',scrollTrigger:{trigger:t,start:'top 92%',once:true}}));
    if(matchMedia('(hover:hover) and (pointer:fine)').matches)root.querySelectorAll('.tile').forEach(t=>{
     const rx=gsap.quickTo(t,'rotationX',{duration:.5,ease:'power3.out'}),ry=gsap.quickTo(t,'rotationY',{duration:.5,ease:'power3.out'});
     gsap.set(t,{transformPerspective:900});
     const mv=e=>{const r=t.getBoundingClientRect(),px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;ry(px*8);rx(-py*8);t.style.setProperty('--mx',(e.clientX-r.left)+'px');t.style.setProperty('--my',(e.clientY-r.top)+'px')};
     const lv=()=>{gsap.to(t,{rotationX:0,rotationY:0,duration:.8,ease:'elastic.out(1,.6)',overwrite:'auto'})};
     t.addEventListener('pointermove',mv);t.addEventListener('pointerleave',lv)})}
  else if(v==='3'){gsap.utils.toArray('.tile',root).forEach(t=>gsap.from(t,{y:28,opacity:0,duration:.85,ease:'expo.out',scrollTrigger:{trigger:t,start:'top 92%',once:true}}));
    const rows=gsap.utils.toArray('.mq .row',root);let vel=0;
    rows.forEach((r,i)=>{const w=r.scrollWidth/3,dir=i%2?1:-1;const x=gsap.quickSetter(r,'x','px');let p=dir>0?-w:0;r._s={x,w,dir,p}});
    const tick=()=>{rows.forEach(r=>{const s=r._s;s.p+=s.dir*(.6+Math.abs(vel)*.12);if(s.dir<0&&s.p<=-s.w)s.p+=s.w;if(s.dir>0&&s.p>=0)s.p-=s.w;s.x(s.p)});vel*=.92};
    gsap.ticker.add(tick);cleanup.push(()=>gsap.ticker.remove(tick));
    let last=scrollY;const sc=()=>{vel=Math.max(-40,Math.min(40,scrollY-last));last=scrollY};addEventListener('scroll',sc,{passive:true});cleanup.push(()=>removeEventListener('scroll',sc))}
  else if(v==='4'){const st=root.querySelector('.stack');[...st.children].forEach((t,i)=>{t.style.setProperty('--i',i);
     gsap.to(t,{scale:.94,opacity:.9,ease:'none',scrollTrigger:{trigger:t,start:'top 20%',end:'+=60%',scrub:.6}})});
    gsap.utils.toArray('.sk .tile',root).forEach(t=>gsap.from(t,{y:28,opacity:0,duration:.85,ease:'expo.out',scrollTrigger:{trigger:t,start:'top 92%',once:true}}))}
  else if(v==='5'){gsap.utils.toArray('.tile',root).forEach(t=>gsap.from(t,{y:28,opacity:0,duration:.85,ease:'expo.out',scrollTrigger:{trigger:t,start:'top 92%',once:true}}));
    root.querySelectorAll('.bars i').forEach((i,k)=>gsap.from(i,{scaleY:0,duration:.8,ease:'expo.out',delay:.2+k*.04,scrollTrigger:{trigger:i,start:'top 95%',once:true}}));
    const sp=root.querySelector('.spot');const iso=g=>sp.querySelectorAll('.tile').forEach(t=>gsap.to(t,{opacity:g==null||t.dataset.g===g?1:.35,duration:.25,ease:'power2.out',overwrite:'auto'}));
    sp.querySelectorAll('.tile').forEach(t=>{t.addEventListener('pointerenter',()=>{if(matchMedia('(hover:hover)').matches)iso(t.dataset.g)});t.addEventListener('focus',()=>iso(t.dataset.g));t.addEventListener('blur',()=>iso(null))});
    sp.addEventListener('pointerleave',()=>iso(null))}
 },root);
 ScrollTrigger.refresh();
}
function load(){root.innerHTML=V[sel.value]();scrollTo(0,0);play()}
sel.onchange=load;rm.addEventListener('change',load);load();
document.fonts&&document.fonts.ready.then(()=>ScrollTrigger.refresh());
</script></body></html>
