<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bento variants · Experience &amp; Skills</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--sans:'Bricolage Grotesque',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;--gut:clamp(16px,5vw,72px)}
*{box-sizing:border-box}html,body{margin:0}body{font-family:var(--sans);-webkit-font-smoothing:antialiased;transition:background .3s}
#bar{position:fixed;z-index:100;top:0;left:0;right:0;display:flex;gap:12px;align-items:center;padding:10px 14px;background:rgba(10,11,13,.92);color:#fff;font:500 12px var(--mono)}
#bar select{font:inherit;background:#1b1d22;color:#fff;border:1px solid #3a3d45;border-radius:8px;padding:8px 10px;max-width:72vw}
h2,h3,p,ul{margin:0}ul{padding:0;list-style:none}
.page{padding:calc(48px + clamp(48px,8vw,110px)) var(--gut) clamp(64px,9vw,130px);max-width:1500px;margin-inline:auto;background:var(--bg);color:var(--ink)}
.wrapbg{background:var(--bg)}
.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:0 0 24px}
.head+.bento{margin-bottom:clamp(56px,8vw,110px)}
h2{font-weight:800;letter-spacing:-.06em;font-size:clamp(2.6rem,7vw,6rem);line-height:.9;color:var(--h2,var(--ink))}
.head span{font:500 .75rem var(--mono);letter-spacing:.12em;text-transform:uppercase;opacity:.6}
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--gap,14px)}
.t{border-radius:var(--r,22px);padding:clamp(20px,2.4vw,34px);position:relative;overflow:hidden;min-height:210px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;opacity:0;transform:translateY(18px) scale(.98);transition:opacity .6s cubic-bezier(.23,1,.32,1),transform .6s cubic-bezier(.23,1,.32,1)}
.t.in{opacity:1;transform:none}
@media(hover:hover) and (pointer:fine){.t.in:hover{transform:translateY(-4px)}.t{transition:opacity .6s cubic-bezier(.23,1,.32,1),transform .25s cubic-bezier(.23,1,.32,1)}}
@media(prefers-reduced-motion:reduce){.t{transform:none;transition:opacity .3s}}
.y{font:800 clamp(2.6rem,6vw,5rem)/.9 var(--sans);letter-spacing:-.06em}
.t h3{font-size:clamp(1.2rem,2vw,1.7rem);letter-spacing:-.03em;line-height:1.08}
.o{font:500 .72rem var(--mono);letter-spacing:.1em;text-transform:uppercase;opacity:.72;margin-top:8px}
.t p.d{line-height:1.5;opacity:.88;margin-top:12px;font-size:.95rem}
.k{font:700 .72rem var(--mono);letter-spacing:.16em;text-transform:uppercase;opacity:.7}
.t ul{display:flex;flex-wrap:wrap;gap:6px}.t li{font-size:.85rem;padding:5px 11px;border-radius:99px;border:1px solid currentColor;border-color:color-mix(in srgb,currentColor 30%,transparent)}
.big{font:800 clamp(2.6rem,6vw,5rem)/.9 var(--sans);letter-spacing:-.06em}
/* spans */
.s6{grid-column:span 6}.s4{grid-column:span 4}.s3{grid-column:span 3}.s2{grid-column:span 2}
@media(max-width:860px){.bento>*{grid-column:span 6!important}.t{min-height:0}}

/* THEMES */
.th-dark{--bg:#0b0c10;--ink:#f3f1ea}
.th-dark .c1{background:#ffe14d;color:#10131f}.th-dark .c2{background:#1636e8;color:#fff}.th-dark .c3{background:#f3f1ea;color:#10131f}.th-dark .c4{background:#ff7a45;color:#150a05}
.th-dark .c5{background:#15171e;border:1px solid #262a35;color:#f3f1ea}
.th-cob{--bg:#1636e8;--ink:#fff;--h2:#fff;--r:26px}
.th-cob .c1{background:#ffe14d;color:#0f1a5c}.th-cob .c2{background:#fff;color:#1636e8}.th-cob .c3{background:#0f2bc0;color:#fff}.th-cob .c4{background:#0a1a7a;color:#ffe14d}
.th-cob .c5{background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.35);color:#fff}
.th-pap{--bg:#f2eee4;--ink:#16130d;--h2:#16130d;--r:28px}
.th-pap .c1{background:#c9d6ff;color:#0d1330}.th-pap .c2{background:#ffd9c2;color:#2a1305}.th-pap .c3{background:#d9ecc8;color:#10200a}.th-pap .c4{background:#ffe9a0;color:#2a2100}
.th-pap .c5{background:#fff;border:1.5px solid #16130d;color:#16130d}
.th-pap .t li{border-color:rgba(22,19,13,.3)}
.sk .t{justify-content:flex-start}.sk .t ul{margin-top:auto}
.stat{align-items:flex-start}
.stat .big{margin-top:auto}
.bar{height:8px;border-radius:9px;background:rgba(0,0,0,.18);overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;background:currentColor;transform-origin:left;transform:scaleX(0);transition:transform 1.1s .3s cubic-bezier(.23,1,.32,1)}.t.in .bar i{transform:scaleX(var(--w))}
</style></head><body>
<div id="bar"><label for="sel">Bento</label><select id="sel">
<option value="1">A · Classic dark bento, tidied (4 tiles + 4 skill tiles)</option>
<option value="2">B · Cobalt &amp; yellow (matches current site)</option>
<option value="3">C · Paper pastel (light, soft colour tiles)</option>
<option value="4">D · One board: stats + roles + skills, dark</option>
<option value="5">E · One board: cobalt, big skill numerals, timeline bar</option>
</select></div>
<div id="root" class="wrapbg"></div>
<script>
const E=s=>s.replace(/&/g,'&amp;'),li=a=>a.map(x=>`<li>${E(x)}</li>`).join('');
const SK=[['Languages',['Python','TypeScript / JavaScript','SQL','PHP','Java','HTML / CSS']],['Data & ML',['pandas, NumPy, SciPy','scikit-learn','Time-series forecasting','Walk-forward validation','Feature engineering','Statistical testing','D3']],['Engineering',['React, Vite, Tailwind','FastAPI, Express','PostgreSQL','Git, GitHub Actions','pytest, Playwright','Accessibility (axe, WCAG AA)']],['Product & systems',['Workflow design','Role-based access','Audit logging','Technical writing','Release and handover docs']]];
const F={t:'Freelance Web Developer',o:'Travel Without Borders · M.G. Drive Pro',d:'Front-end rebuild of a live production WordPress site as an upgrade-safe child theme, and a full-stack build for a local driving instructor, both with measurement, accessibility and documentation built in.'};
const SUP={d:'Worked on the build as a regular site worker from 2021 and was given the supervisor role in 2025. Since then I have coordinated contractors, scheduling, procurement and on-site delivery across concurrent workstreams.'};
const DEG={t:'BSc Computer Science, Newcastle University',d:'Modules: Machine Learning, Data Science, Software Engineering, Database Systems, Algorithms & Data Structures, Software Architecture, Data Visualisation, AI Implementation.'};
const tile=(cls,span,inner,extra='')=>`<div class="t ${cls} ${span}" ${extra}>${inner}</div>`;
const role=(y,h,o,d)=>`<div class="y">${y}</div><div><h3>${E(h)}</h3><p class="o">${E(o)}</p>${d?`<p class="d">${E(d)}</p>`:''}</div>`;
const skill=(h,a,n)=>`<h3 class="k">${E(h)}</h3><div class="big">${String(a.length).padStart(2,'0')}</div><ul>${li(a)}</ul>`;
const head=(a,b)=>`<div class="head"><h2>${a}</h2><span>${b}</span></div>`;
const V={
1:()=>`<div class="page th-dark">${head('Experience','2021 → now')}<div class="bento">
${tile('c1','s4',role('2026 →',F.t,F.o,F.d))}${tile('c2','s2',role('BSc',DEG.t,'Graduated 2026',''))}
${tile('c3','s3',role('2021 →','Site Worker','Residential renovation · 2021 – 2025','Worked on the build as a regular site worker.'))}${tile('c4','s3',role('2025 →','Site Supervisor','Residential renovation · since 2025','Coordinating contractors, scheduling, procurement and on-site delivery across concurrent workstreams.'))}</div>
${head('Skills','4 areas')}<div class="bento sk">${SK.map(([h,a],i)=>tile(i==1?'c2':'c5','s3',skill(h,a))).join('')}</div></div>`,
2:()=>`<div class="page th-cob">${head('Experience','2021 → now')}<div class="bento">
${tile('c1','s4',role('2026 →',F.t,F.o,F.d))}${tile('c2','s2',role('BSc',DEG.t,'Graduated 2026',''))}
${tile('c4','s2','<div class="y">8</div><div><h3>Modules</h3><p class="o">Machine Learning · Data Science · Software Eng · Databases · Algorithms · Architecture · Data Vis · AI</p></div>')}
${tile('c3','s2',role('2021 →','Site Worker','Residential renovation','Regular site worker 2021 – 2025.'))}${tile('c5','s2',role('2025 →','Site Supervisor','Residential renovation','Contractors, scheduling, procurement and on-site delivery across concurrent workstreams.'))}</div>
${head('Skills','4 areas')}<div class="bento sk">${SK.map(([h,a],i)=>tile(['c1','c5','c5','c2'][i],'s3',skill(h,a))).join('')}</div></div>`,
3:()=>`<div class="page th-pap">${head('Experience','2021 → now')}<div class="bento">
${tile('c1','s4',role('2026 →',F.t,F.o,F.d))}${tile('c2','s2',role('BSc',DEG.t,'Graduated 2026',''))}
${tile('c3','s3',role('2021 →','Site Worker','Residential renovation · 2021 – 2025','Worked on the build as a regular site worker.'))}${tile('c4','s3',role('2025 →','Site Supervisor','Residential renovation · since 2025','Coordinating contractors, scheduling, procurement and on-site delivery across concurrent workstreams.'))}</div>
${head('Skills','4 areas')}<div class="bento sk">${SK.map(([h,a],i)=>tile(['c5','c5','c5','c5'][i],'s3',skill(h,a))).join('')}</div></div>`,
4:()=>`<div class="page th-dark">${head('Experience &amp; Skills','the short version')}<div class="bento">
${tile('c1','s4',role('2026 →',F.t,F.o,F.d))}${tile('c2 stat','s2','<h3 class="k">On site</h3><div class="big">5 yrs</div><p class="o">Worker → supervisor, 2021 – now</p>')}
${tile('c3','s2',role('2021 →','Site Worker','Residential renovation','Regular site worker 2021 – 2025.'))}${tile('c4','s2',role('2025 →','Site Supervisor','Residential renovation','Contractors, scheduling, procurement and on-site delivery.'))}${tile('c5 stat','s2','<h3 class="k">Degree</h3><div class="big">BSc</div><p class="o">Computer Science · Newcastle · 2026</p>')}
${tile('c5','s3',skill(SK[0][0],SK[0][1]))}${tile('c5','s3',skill(SK[1][0],SK[1][1]))}${tile('c5','s3',skill(SK[2][0],SK[2][1]))}${tile('c5','s3',skill(SK[3][0],SK[3][1]))}</div></div>`,
5:()=>`<div class="page th-cob">${head('Experience &amp; Skills','2021 → 2026')}<div class="bento">
${tile('c1','s6','<h3 class="k">Timeline</h3><div style="display:grid;gap:10px;margin-top:6px"><div><div class="o" style="margin:0 0 4px">Site worker → supervisor · 2021 – now</div><div class="bar"><i style="--w:1"></i></div></div><div><div class="o" style="margin:0 0 4px">BSc Computer Science · graduated 2026</div><div class="bar"><i style="--w:.84"></i></div></div><div><div class="o" style="margin:0 0 4px">Freelance web developer · 2026 – now</div><div class="bar"><i style="--w:.2"></i></div></div></div>')}
${tile('c2','s3',role('2026 →',F.t,F.o,F.d))}${tile('c4','s3',role('2025 →','Site Supervisor','Site worker 2021 – 2025 · Residential renovation',SUP.d))}
${tile('c5','s2',role('BSc','Computer Science','Newcastle University · 2026',''))}${tile('c3','s4','<h3 class="k">Modules</h3><ul style="margin-top:8px">'+li(['Machine Learning','Data Science','Software Engineering','Database Systems','Algorithms & Data Structures','Software Architecture','Data Visualisation','AI Implementation'])+'</ul>')}
${SK.map(([h,a],i)=>tile(i%2?'c1':'c5','s3',skill(h,a))).join('')}</div></div>`};
const root=document.getElementById('root'),sel=document.getElementById('sel');
const BG={1:'#0b0c10',2:'#1636e8',3:'#f2eee4',4:'#0b0c10',5:'#1636e8'};
function load(){root.innerHTML=V[sel.value]();document.body.style.background=BG[sel.value];scrollTo(0,0);
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const ts=[...e.target.parentNode.children];setTimeout(()=>e.target.classList.add('in'),(ts.indexOf(e.target)%3)*70);io.unobserve(e.target)}}),{threshold:.1});
 root.querySelectorAll('.t').forEach(t=>io.observe(t))}
sel.onchange=load;load();
</script></body></html>
