<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>About layouts · awwwards pass</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--sans:'Bricolage Grotesque',system-ui,sans-serif;--serif:'Instrument Serif',Georgia,serif;--mono:'JetBrains Mono',ui-monospace,monospace;--gut:clamp(18px,5vw,72px);--out:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box}html,body{margin:0}body{overflow-x:clip;font-family:var(--sans);-webkit-font-smoothing:antialiased;transition:background .3s}
#bar{position:fixed;z-index:100;top:0;left:0;right:0;display:flex;gap:12px;align-items:center;padding:10px 14px;background:rgba(10,11,13,.92);color:#fff;font:500 12px var(--mono)}
#bar select{font:inherit;background:#1b1d22;color:#fff;border:1px solid #3a3d45;border-radius:8px;padding:8px 10px;max-width:72vw}
h2,h3,p,ol,figure{margin:0}ol{padding:0;list-style:none}
.pg{overflow-x:clip;padding:calc(48px + clamp(48px,8vw,110px)) var(--gut) clamp(72px,10vw,150px);max-width:1500px;margin-inline:auto}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.16em;margin-bottom:-.16em}.w>span{display:inline-block}
.mono{font:500 .72rem var(--mono);letter-spacing:.1em;text-transform:uppercase}
img{display:block;width:100%}
/* ===== paper tokens ===== */
.paper{--bg:#ece4d3;--ink:#1d1a14;--mut:#5a523f;--acc:#a63a15;--line:rgba(29,26,20,.22);background:var(--bg);color:var(--ink)}
.dark{--bg:#14110c;--ink:#f1e9d8;--mut:#a79d86;--acc:#ff8a5c;--line:rgba(241,233,216,.22);background:var(--bg);color:var(--ink)}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.035em}
/* ===== V1 editorial refined ===== */
.v1 h2{font-family:var(--serif);font-weight:400;font-size:clamp(3.2rem,10vw,10rem);letter-spacing:-.035em;line-height:.88;margin-bottom:clamp(36px,6vw,88px)}
.v1 .grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(32px,7vw,120px);align-items:start}
.v1 .prose p{font-family:var(--serif);font-size:clamp(1.5rem,1.1rem + 1.5vw,2.4rem);line-height:1.2;letter-spacing:-.01em;margin-bottom:.8em}
.note{margin-top:clamp(32px,5vw,56px);padding-top:22px;border-top:2px solid var(--ink);display:grid;grid-template-columns:150px 1fr;gap:12px 24px}
.note h3{font:500 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--acc);padding-top:.35em}
.note p{line-height:1.55;font-size:1.05rem}
.arch{overflow:hidden;border-radius:999px 999px 0 0;aspect-ratio:788/640}
.arch img{height:112%;object-fit:cover;object-position:50% 15%;will-change:transform}
.cap{margin-top:12px;font:500 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);margin-top:clamp(56px,9vw,130px);position:relative}
.pillars::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--ink);transform-origin:left;transform:scaleX(var(--ln,1))}
.pillars li{padding:28px 28px 0 0}.pillars li+li{padding-left:28px;border-left:1px solid var(--line)}
.pillars .idx{font-family:var(--serif);font-size:3.4rem;line-height:1;display:block}
.pillars h3{font-family:var(--serif);font-weight:400;font-size:clamp(1.8rem,2.8vw,2.8rem);letter-spacing:-.02em;margin:8px 0 10px;line-height:1.05}
.pillars p{color:var(--mut);max-width:34ch;line-height:1.5}
/* ===== V2 portrait-led ===== */
.v2 .hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,5vw,80px);align-items:end}
.v2 .ph{overflow:hidden;border-radius:18px;aspect-ratio:4/5;position:relative}
.v2 .ph img{height:100%;object-fit:cover;object-position:50% 12%}
.v2 h2{font-family:var(--serif);font-weight:400;font-size:clamp(3rem,8.4vw,8.6rem);line-height:.9;letter-spacing:-.04em}
.v2 h2 em{color:var(--acc)}
.v2 .copy{margin-top:clamp(28px,4vw,56px);display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,4vw,56px)}
.v2 .copy p{line-height:1.6;font-size:1.05rem}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:clamp(48px,7vw,100px)}
.strip li{background:var(--ink);color:var(--bg);border-radius:18px;padding:clamp(20px,2.4vw,30px);display:flex;flex-direction:column;gap:10px;min-height:190px}
.strip .idx{font:700 .75rem var(--mono);color:var(--acc)}.strip h3{font-family:var(--serif);font-weight:400;font-size:clamp(1.6rem,2.4vw,2.2rem);letter-spacing:-.02em;line-height:1.05}.strip p{opacity:.8;line-height:1.5;margin-top:auto}
/* ===== V3 dark, scroll-lit prose ===== */
.v3 h2{font-family:var(--serif);font-weight:400;font-size:clamp(3.4rem,11vw,11rem);line-height:.86;letter-spacing:-.045em;margin-bottom:clamp(40px,7vw,96px)}
.v3 .lit{font-family:var(--serif);font-size:clamp(1.7rem,1rem + 2.6vw,3.4rem);line-height:1.12;letter-spacing:-.015em;max-width:26ch;max-width:30em}
.v3 .lit p+p{margin-top:.7em}.v3 .lit .t{opacity:.22;transition:none}
.v3 .row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:clamp(24px,6vw,96px);align-items:start}
.v3 .ph{position:sticky;top:90px;aspect-ratio:1;overflow:hidden;border-radius:50%}
.v3 .ph img{height:100%;object-fit:cover;object-position:50% 14%;filter:grayscale(.15) contrast(1.02)}
.v3 .pillars::before{background:var(--ink)}
/* ===== V4 hover panels ===== */
.v4 h2{font-family:var(--serif);font-weight:400;font-size:clamp(3rem,8vw,8rem);line-height:.9;letter-spacing:-.04em;margin-bottom:clamp(28px,4vw,56px)}
.v4 .top{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.6fr);gap:clamp(24px,5vw,80px);align-items:start}
.v4 .prose p{font-family:var(--serif);font-size:clamp(1.35rem,1rem + 1.2vw,2rem);line-height:1.22;margin-bottom:.7em}
.v4 .ph{aspect-ratio:4/3;overflow:hidden;border-radius:14px}.v4 .ph img{height:100%;object-fit:cover;object-position:50% 12%}
.panels{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:clamp(40px,6vw,88px);border-top:2px solid var(--ink)}
.panel{position:relative;overflow:hidden;padding:clamp(24px,3vw,40px);min-height:300px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--line);cursor:default}
.panel:last-child{border-right:0}
.panel::before{content:"";position:absolute;inset:0;background:var(--ink);transform:translateY(101%);transition:transform .45s var(--out)}
.panel>*{position:relative;transition:color .3s ease}
.panel .big{font-family:var(--serif);font-size:clamp(5rem,12vw,10rem);line-height:.8}
.panel h3{font-family:var(--serif);font-weight:400;font-size:clamp(1.8rem,2.8vw,2.8rem);letter-spacing:-.02em;line-height:1.05;margin-bottom:8px}
.panel p{color:var(--mut);max-width:34ch;line-height:1.5}
.panel:focus-visible{outline:2px solid var(--acc);outline-offset:-4px}
.panel.on::before{transform:none}.panel.on>*{color:var(--bg)}.panel.on p{color:color-mix(in srgb,var(--bg) 78%,transparent)}.panel.on .big{color:var(--acc)}
/* ===== V5 badge / collage ===== */
.v5{--bg:#e9e1cf}
.v5 .stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,6vw,96px);align-items:center}
.v5 h2{font-family:var(--serif);font-weight:400;font-size:clamp(3.2rem,9vw,9rem);line-height:.88;letter-spacing:-.04em}
.v5 .prose p{margin-top:1.1em;line-height:1.6;font-size:1.08rem;max-width:52ch}
.v5 .fig{position:relative;max-width:520px;justify-self:center;width:100%}
.v5 .arch{aspect-ratio:4/5;border-radius:999px 999px 18px 18px}.v5 .arch img{height:100%}
.v5 .badge{position:absolute;right:-6%;bottom:6%;width:clamp(110px,16vw,170px);aspect-ratio:1;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;will-change:transform}
.v5 .badge svg{position:absolute;inset:0;width:100%;height:100%;animation:spin 18s linear infinite}
.v5 .badge b{font-family:var(--serif);font-weight:400;font-size:clamp(1.6rem,3.4vw,2.6rem);letter-spacing:-.02em}
@keyframes spin{to{transform:rotate(360deg)}}
.v5 .card{position:absolute;left:-10%;top:8%;width:min(260px,52%);background:#fff;color:#1d1a14;border-radius:14px;padding:16px 18px;box-shadow:0 18px 40px -18px rgba(0,0,0,.4);rotate:-3deg;font-size:.9rem;line-height:1.45}
.v5 .card h3{font:500 .68rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
.v5 .pillars{margin-top:clamp(56px,9vw,120px)}
@media(prefers-reduced-motion:reduce){.v5 .badge svg{animation:none}}
@media(max-width:860px){.v1 .grid,.v2 .hero,.v2 .copy,.v3 .row,.v4 .top,.v5 .stage{grid-template-columns:minmax(0,1fr)}.pillars,.strip,.panels{grid-template-columns:minmax(0,1fr)}.pillars li,.pillars li+li{padding:24px 0;border-left:0;border-bottom:1px solid var(--line)}.note{grid-template-columns:1fr}.v3 .ph{position:relative;top:0;max-width:280px}.v5 .card{left:0;rotate:-2deg}.v5 .badge{right:2%}.panel{border-right:0;border-bottom:1px solid var(--line);min-height:0}.v2 .ph{max-width:420px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<div id="bar"><label for="sel">About</label><select id="sel">
<option value="1">1 · Editorial, refined: arch portrait with parallax, drawn rule</option>
<option value="2">2 · Portrait-led: big photo + headline, dark pillar cards</option>
<option value="3">3 · Dark ink: prose lights up word by word as you scroll</option>
<option value="4">4 · Pillar panels: fill with ink on hover / focus / tap</option>
<option value="5">5 · Collage: arch photo, spinning badge, pinned note card</option>
</select></div>
<div id="root"></div>

const ALT="Pascal Skannavis in graduation gown outside a red-brick university building";
const words=(t,tag='h2')=>t.split('<br>').map(l=>l.trim().split(' ').map(w=>`<span class="w" aria-hidden="true"><span>${w}</span></span>`).join(' ')).join('<br>');
const H=(cls='')=>`<h2 class="${cls}" aria-label="Planning, evidence and delivery.">${words('Planning, evidence<br>and delivery.')}</h2>`;
const P1="I'm a Computer Science graduate (BSc, Newcastle University, 2026) focused on applied machine learning, data and software engineering. What connects my projects is evaluation: I care whether a result holds up under realistic conditions, not just whether it looks good in a notebook.";
const P2="Alongside my degree I've worked as a freelance web developer, worked on a multi-year residential renovation (as a site worker from 2021 and Site Supervisor since 2025), and competed internationally in powerlifting. That mix taught me to plan carefully, work to deadlines, and deliver under pressure.";
const NOTE=`<aside class="note" aria-labelledby="hw"><h3 id="hw">How I work</h3><p>I use AI coding assistants throughout my projects, and I say so openly. I set the architecture, rules and acceptance criteria, review what's produced, and measure the results with tests and audits.</p></aside>`;
const PIL=[['A','Test honestly','Same models, same features, different protocol. The protocol decides what you can claim.'],['B','Build to be audited','Rules written down, enforced by tests, and checked across every route, role and viewport.'],['C','Ship for real','Live sites for real clients, with measurement, accessibility and handover documentation.']];
const pil=()=>`<ol class="pillars">${PIL.map(([i,h,p])=>`<li><span class="idx">${i}</span><h3>${h}</h3><p>${p}</p></li>`).join('')}</ol>`;
const V={
1:()=>`<div class="paper v1"><div class="pg">${H()}<div class="grid"><div><div class="prose"><p>${P1}</p><p>${P2}</p></div>${NOTE}</div><figure><div class="arch"><img src="${IMG}" width="788" height="743" alt="${ALT}"></div><figcaption class="cap">Graduation day</figcaption></figure></div>${pil()}</div></div>`,
2:()=>`<div class="paper v2"><div class="pg"><div class="hero"><figure><div class="ph"><img src="${IMG}" width="788" height="743" alt="${ALT}"></div><figcaption class="cap">Graduation day</figcaption></figure><div>${H()}<div class="copy"><p>${P1}</p><p>${P2}</p></div>${NOTE}</div></div><ol class="strip">${PIL.map(([i,h,p])=>`<li><span class="idx">${i}</span><h3>${h}</h3><p>${p}</p></li>`).join('')}</ol></div></div>`,
3:()=>`<div class="dark v3"><div class="pg">${H()}<div class="row"><div><div class="lit" id="lit"><p>${P1.split(' ').map(w=>`<span class="t">${w}</span>`).join(' ')}</p><p>${P2.split(' ').map(w=>`<span class="t">${w}</span>`).join(' ')}</p></div>${NOTE}</div><figure><div class="ph"><img src="${IMG}" width="788" height="743" alt="${ALT}"></div><figcaption class="cap">Graduation day</figcaption></figure></div>${pil()}</div></div>`,
4:()=>`<div class="paper v4"><div class="pg">${H()}<div class="top"><div><div class="prose"><p>${P1}</p><p>${P2}</p></div>${NOTE}</div><figure><div class="ph"><img src="${IMG}" width="788" height="743" alt="${ALT}"></div><figcaption class="cap">Graduation day</figcaption></figure></div><ol class="panels">${PIL.map(([i,h,p])=>`<li class="panel" tabindex="0"><span class="big" aria-hidden="true">${i}</span><div><h3>${h}</h3><p>${p}</p></div></li>`).join('')}</ol></div></div>`,
5:()=>`<div class="paper v5"><div class="pg"><div class="stage"><div>${H()}<div class="prose"><p>${P1}</p><p>${P2}</p></div></div><figure class="fig"><div class="arch"><img src="${IMG}" width="788" height="743" alt="${ALT}"></div><div class="badge"><svg viewBox="0 0 100 100" aria-hidden="true"><defs><path id="c" d="M50 50m-38 0a38 38 0 1 1 76 0a38 38 0 1 1-76 0"/></defs><text font-family="JetBrains Mono,monospace" font-size="8.4" letter-spacing="2.4" fill="currentColor"><textPath href="#c">NEWCASTLE UNIVERSITY · BSC COMPUTER SCIENCE ·</textPath></text></svg><b aria-hidden="true">2026</b></div><div class="card"><h3>How I work</h3>I use AI coding assistants throughout my projects, and I say so openly. I set the architecture, rules and acceptance criteria, review what's produced, and measure the results with tests and audits.</div></figure></div>${pil()}</div></div>`};
const root=document.getElementById('root'),sel=document.getElementById('sel');
const BG={1:'#ece4d3',2:'#ece4d3',3:'#14110c',4:'#ece4d3',5:'#e9e1cf'};
const rm=matchMedia('(prefers-reduced-motion: reduce)');let ctx,cl=[];
function play(){ctx&&ctx.revert();cl.forEach(f=>f());cl=[];ScrollTrigger.getAll().forEach(s=>s.kill());
 if(rm.matches){root.querySelectorAll('.t').forEach(t=>t.style.opacity=1);return}
 const v=sel.value;
 ctx=gsap.context(()=>{
  root.querySelectorAll('h2').forEach(h=>gsap.from(h.querySelectorAll('.w>span'),{yPercent:115,duration:1,ease:'expo.out',stagger:.08,scrollTrigger:{trigger:h,start:'top 92%',once:true}}));
  const up=(sel,o={})=>gsap.utils.toArray(sel,root).forEach((e,i)=>gsap.from(e,{y:28,opacity:0,duration:.9,ease:'expo.out',...o,scrollTrigger:{trigger:e,start:'top 90%',once:true}}));
  const wipe=e=>gsap.from(e,{clipPath:'inset(0 0 100% 0)',duration:1.1,ease:'expo.out',scrollTrigger:{trigger:e,start:'top 90%',once:true}});
  if(v==='1'){up('.prose p,.note');wipe(root.querySelector('.arch'));
    gsap.fromTo('.arch img',{yPercent:-6},{yPercent:6,ease:'none',scrollTrigger:{trigger:'.arch',start:'top bottom',end:'bottom top',scrub:.6}});
    gsap.from('.pillars',{'--ln':0,duration:1.2,ease:'expo.out',scrollTrigger:{trigger:'.pillars',start:'top 88%',once:true}});
    gsap.from('.pillars li',{y:24,opacity:0,duration:.8,ease:'expo.out',stagger:.1,scrollTrigger:{trigger:'.pillars',start:'top 85%',once:true}})}
  if(v==='2'){wipe(root.querySelector('.ph'));gsap.from('.ph img',{scale:1.12,duration:1.4,ease:'expo.out',scrollTrigger:{trigger:'.ph',start:'top 90%',once:true}});up('.copy p,.note');
    gsap.from('.strip li',{y:36,opacity:0,scale:.97,duration:.9,ease:'expo.out',stagger:.09,scrollTrigger:{trigger:'.strip',start:'top 88%',once:true}})}
  if(v==='3'){const ts=gsap.utils.toArray('.t',root);gsap.to(ts,{opacity:1,ease:'none',stagger:.5,scrollTrigger:{trigger:'#lit',start:'top 75%',end:'bottom 45%',scrub:.4}});
    up('.note');gsap.from('.v3 .ph',{scale:.9,opacity:0,duration:1.1,ease:'expo.out',scrollTrigger:{trigger:'.v3 .ph',start:'top 90%',once:true}});
    gsap.from('.pillars li',{y:24,opacity:0,duration:.8,ease:'expo.out',stagger:.1,scrollTrigger:{trigger:'.pillars',start:'top 88%',once:true}})}
  if(v==='4'){up('.prose p,.note');wipe(root.querySelector('.ph'));
    gsap.from('.panel',{y:30,opacity:0,duration:.9,ease:'expo.out',stagger:.1,scrollTrigger:{trigger:'.panels',start:'top 88%',once:true}});
    const ps=[...root.querySelectorAll('.panel')];const set=p=>ps.forEach(x=>x.classList.toggle('on',x===p));
    ps.forEach(p=>{p.addEventListener('focus',()=>set(p));p.addEventListener('blur',()=>set(null));p.addEventListener('click',()=>set(p));
      if(matchMedia('(hover:hover) and (pointer:fine)').matches){p.addEventListener('pointerenter',()=>set(p));p.addEventListener('pointerleave',()=>set(null))}})}
  if(v==='5'){up('.prose p');wipe(root.querySelector('.arch'));
    gsap.from('.badge',{scale:.5,rotate:-40,opacity:0,duration:1,ease:'expo.out',delay:.3,scrollTrigger:{trigger:'.fig',start:'top 85%',once:true}});
    gsap.from('.card',{y:30,opacity:0,duration:.9,ease:'expo.out',delay:.5,scrollTrigger:{trigger:'.fig',start:'top 85%',once:true}});
    gsap.to('.badge',{y:-30,ease:'none',scrollTrigger:{trigger:'.fig',start:'top bottom',end:'bottom top',scrub:.8}});
    gsap.from('.pillars li',{y:24,opacity:0,duration:.8,ease:'expo.out',stagger:.1,scrollTrigger:{trigger:'.pillars',start:'top 88%',once:true}})}
 },root);ScrollTrigger.refresh()}
function load(){root.innerHTML=V[sel.value]();document.body.style.background=BG[sel.value];scrollTo(0,0);play()}
sel.onchange=load;rm.addEventListener('change',load);load();
document.fonts&&document.fonts.ready.then(()=>ScrollTrigger.refresh());
</script></body></html>
